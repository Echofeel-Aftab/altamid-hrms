<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Altamid HRMS</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#103860">
    <link rel="icon" type="image/png" href="brand/logo-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script>
      try {
        if (localStorage.getItem('altamid_hrms_theme') === 'dark') {
          document.documentElement.classList.add('theme-dark');
        }
        if (localStorage.getItem('altamid_hrms_sidebar') === '1' && window.matchMedia('(min-width: 992px)').matches) {
          document.documentElement.classList.add('sidebar-collapsed');
        }
        var pack = localStorage.getItem('altamid_hrms_desk_pack') === 'classic' ? 'classic' : 'masonry';
        document.documentElement.classList.add('desk-pack-' + pack);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
