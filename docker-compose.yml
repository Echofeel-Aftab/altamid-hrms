services:
  db:
    image: postgres:16
    container_name: altamid-hrms-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms_dev_change_me
      POSTGRES_DB: altamid_hrms
    volumes:
      - hrms_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d altamid_hrms"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  hrms_pg:
